name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate JavaScript and shell syntax
        run: |
          jq --version
          node --check _worker.js
          node --check admin-egress.js
          for script in deploy/macmini/*.sh deploy/nas/*.sh; do
            sh -n "$script"
          done
      - run: npm test
