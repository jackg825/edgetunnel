name: Upstream Update Check

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  check_upstream:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - name: Report updates for a reviewed merge
        run: |
          git fetch --no-tags https://github.com/cmliu/edgetunnel.git main
          upstream_count="$(git rev-list --count HEAD..FETCH_HEAD)"
          printf 'Upstream has %s commits not merged into this fork.\n' "$upstream_count" >> "$GITHUB_STEP_SUMMARY"
          if [ "$upstream_count" -gt 0 ]; then
            printf '%s\n' 'Merge upstream/main on a local branch, run npm test, and submit a reviewed PR. This workflow does not update main.' >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Upstream updates are available; merge them through a tested PR."
          fi
