name = "edgetunnel-macmini-egress"
main = "_worker.js"
compatibility_date = "2025-11-04"
keep_vars = true
workers_dev = false
preview_urls = false

[vars]
EGRESS_SITES = '''
[
  { "id": "mac", "name": "Taiwan Mac mini", "binding": "EGRESS_MAC_NET", "address": "192.0.2.10:19090" },
  { "id": "nas", "name": "Site B NAS", "binding": "EGRESS_NAS_NET", "address": "192.0.2.20:19090" }
]
'''
DEFAULT_EGRESS = "mac"
EGRESS_PROTOCOL = "vless"
HOST = "worker.example.com"
OFF_LOG = "true"

[[routes]]
pattern = "worker.example.com"
custom_domain = true

[[kv_namespaces]]
binding = "KV"
id = "replace-with-kv-namespace-id"

[[vpc_networks]]
binding = "EGRESS_MAC_NET"
tunnel_id = "replace-with-mac-tunnel-id"
remote = true

[[vpc_networks]]
binding = "EGRESS_NAS_NET"
tunnel_id = "replace-with-nas-tunnel-id"
remote = true
