name = "edgetunnel-macmini-egress"
main = "_worker.js"
compatibility_date = "2025-11-04"
keep_vars = true
workers_dev = false
preview_urls = false

[vars]
HOME_EGRESS = "192.0.2.10:19090"
HOME_PROTOCOL = "vless"
HOST = "worker.example.com"
OFF_LOG = "true"

[[routes]]
pattern = "worker.example.com"
custom_domain = true

[[kv_namespaces]]
binding = "KV"
id = "replace-with-kv-namespace-id"

[[vpc_networks]]
binding = "HOME_NET"
tunnel_id = "replace-with-tunnel-id"
remote = true
