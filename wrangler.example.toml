name = "edgetunnel-macmini-egress"
main = "_worker.js"
compatibility_date = "2025-11-04"
keep_vars = true
workers_dev = false
preview_urls = false

[vars]
EGRESS_SITES = '''
[
  { "id": "mac", "name": "Taiwan Mac mini", "binding": "EGRESS_MAC_NET", "address": "127.0.0.1:19090", "secret_env": "EGRESS_MAC_RELAY_PASSWORD" },
  { "id": "nas", "name": "Site B NAS", "binding": "EGRESS_NAS_NET", "address": "192.0.2.20:19090", "secret_env": "EGRESS_NAS_RELAY_PASSWORD" }
]
'''
DEFAULT_EGRESS = "mac"
EGRESS_PROTOCOL = "vless"
HOST = "worker.example.com"
OFF_LOG = "true"

# Store values separately with:
# wrangler secret put EGRESS_MAC_RELAY_PASSWORD
# wrangler secret put EGRESS_NAS_RELAY_PASSWORD

[[routes]]
pattern = "worker.example.com"
custom_domain = true

[[kv_namespaces]]
binding = "KV"
id = "replace-with-kv-namespace-id"

[[vpc_networks]]
binding = "EGRESS_MAC_NET"
tunnel_id = "replace-with-mac-tunnel-id"
remote = true

[[vpc_networks]]
binding = "EGRESS_NAS_NET"
tunnel_id = "replace-with-nas-tunnel-id"
remote = true
